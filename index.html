<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f8" />
    <meta name="description" content="Five daily puzzles about Fremont, California." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23043764'/%3E%3Cpolygon points='0,48 0,32 12,17 22,25 33,4 42,18 48,13 48,48' fill='%23f1f5f8'/%3E%3C/svg%3E"
    />
    <title>Fremont</title>
    <!--
      Runs before first paint so a saved dark theme doesn't flash light.
      Only writes [data-theme] when there is a saved choice — leaving it
      off is what lets the CSS media query keep following the system.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fremont.theme')
          var explicit = saved === 'light' || saved === 'dark'
          if (explicit) document.documentElement.dataset.theme = saved
          var dark = explicit
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#07203a' : '#f1f5f8')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
