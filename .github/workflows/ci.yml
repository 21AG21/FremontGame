name: CI

# Everything that has to be true before a change reaches a player, run
# on every push and every pull request. The daily content job is a
# different thing — it pulls the spreadsheet; this one guards the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      # Validates every row AND checks that src/data/generated still
      # matches content/. Editing a CSV without regenerating would
      # otherwise deploy the old pool with a green build.
      - name: Content
        run: npm run content:check

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
